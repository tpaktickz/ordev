# Group that may reach the OpenRevo EC broker socket.
#
# Membership is what `/run/openrevo/ec.sock` gates on (root:openrevo-ec, 0660).
# It grants nothing by itself: the broker accepts one hex address per line and
# validates every request before touching the controller, and it can only ever
# address the embedded controller, not arbitrary I/O ports.
#
# Packages add the desktop users present at install time; a user created later
# needs `usermod -aG openrevo-ec <user>` and a fresh login, because group
# membership is resolved when the session starts.
g openrevo-ec -
