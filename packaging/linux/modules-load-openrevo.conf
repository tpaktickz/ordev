# Load the two transports the EC broker talks through, so they exist before the
# first read rather than after the first failure.
#
#   ec_sys    - exposes the ACPI EC page the firmware shares (0x400-0x4FF on
#               Tongfang hardware); hot registers then read in under a
#               millisecond instead of a 50 ms mailbox round-trip.
#   acpi_call - evaluates \_SB.AMW0.WMBC, the vendor's own banked-access method,
#               under the firmware mutex. Required for every write and for any
#               register outside the shared page.
ec_sys
acpi_call
