name: Syncfork-dev

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Sync dev branch from upstream
        run: gh repo sync tpaktickz/ordev --source faintonce/open-revo --branch dev --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
