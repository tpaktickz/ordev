name: Syncfork-dev

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync dev branch from upstream
        run: gh repo sync tpaktickz/ordev --source faintonce/open-revo --branch dev --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: "Syncfork-dev"           
          retain_days: 0
          keep_minimum_runs: 0
