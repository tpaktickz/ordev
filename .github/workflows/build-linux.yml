name: Linux Build

on:
  push:
    branches:
      - wayland-kde
  pull_request:
    branches:
      - wayland-kde
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, Test & Frontend Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installed by hand instead of pnpm/action-setup: the `packageManager`
      # field carries a full integrity hash and the action's fallback parsing of
      # it is the first thing to break here. Naming the version outright removes
      # that parse from the path.
      - name: Install pnpm
        run: |
          npm install -g pnpm@10.32.1
          pnpm --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type-check and bundle
        run: pnpm build

      - name: Cargo check (workspace, Linux target)
        working-directory: src-tauri
        run: cargo check --workspace --all-targets

      - name: Clippy (workspace)
        working-directory: src-tauri
        # Warnings are tolerated for now: the Windows-era code carries ~150 of them
        # and gating on those would block the port over style noise. Errors gate.
        run: cargo clippy --workspace --all-targets

      - name: Unit tests
        working-directory: src-tauri
        # The suite is hardware-independent on purpose: anything that needs a real
        # EC or a discrete GPU asserts the "no hardware" branch instead of skipping.
        # `--tests` also covers the privileged helper's input-validation contract.
        run: cargo test -p openrevo-core

  # One job per packaging format, each in its own distribution container, because
  # a .deb and a .rpm have to be built against the library set of the distribution
  # that will install them. Arch is first only because it was the original target.
  package-arch:
    name: Build Arch package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: |
          # `sudo` is not part of base-devel, and makepkg -s needs it for
          # makedepends, so it has to be requested explicitly.
          pacman -Syu --noconfirm --needed git rust nodejs pnpm sudo \
            webkit2gtk-4.1 gtk3 librsvg libappindicator-gtk3 hicolor-icon-theme openssl

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # makepkg refuses to run as root, and the Arch container is root by default.
      - name: Build package as an unprivileged user
        # The PKGBUILD pulls its own source from git; point it at the commit under
        # test. On a pull request that commit lives in the fork, not the base repo.
        env:
          CI_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CI_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          # Everything this step prints also lands in a file, because the web log
          # view cannot be fetched without a token.
          exec > >(tee /tmp/step.log) 2>&1
          useradd -m -s /bin/bash builder
          # makepkg -s installs makedepends through sudo; without this it stops and
          # asks for a password that nobody is there to type.
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder .
          id builder
          ls -ld . packaging/linux
          # `sudo -u` rather than `su`/`runuser`: su trips over PAM's token update
          # for a passwordless account ("Authentication token manipulation error"),
          # and the bare Arch container ships no PAM config for runuser at all.
          cd packaging/linux
          sudo -H -u builder -- env _repo="$CI_REPO" _commit="$CI_SHA" \
            makepkg -s --noconfirm --nocheck 2>&1 | tee /tmp/makepkg.log || {
              rc=$?
              tail -n 120 /tmp/makepkg.log
              exit "$rc"
            }
          ls -1 ./*.pkg.tar.zst

      - uses: ./.github/actions/diag-log
        if: failure()
        with:
          name: arch

      - uses: actions/upload-artifact@v4
        with:
          name: openrevo-arch
          path: packaging/linux/*.pkg.tar.zst
          if-no-files-found: error

  package-deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    container: debian:bookworm
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential debhelper devscripts dpkg-dev \
            nodejs npm pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libdbus-1-dev libudev-dev \
            libsoup-3.0-dev zlib1g-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .deb
        shell: bash
        run: |
          set -euxo pipefail
          : > /tmp/step.log
          exec > >(tee -a /tmp/step.log) 2>&1
          # The checkout is owned by the runner's uid, not by root inside this
          # container, and git refuses to work on it until told otherwise.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Debian's rustc is far below what the dependency tree needs (slint and
          # wgpu both sit above 1.80), so the toolchain comes from rustup and is
          # linked into /usr/local/bin where debian/rules will find it.
          export RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          . "$CARGO_HOME/env"
          ln -sf "$CARGO_HOME/bin/cargo" /usr/local/bin/cargo
          ln -sf "$CARGO_HOME/bin/rustc" /usr/local/bin/rustc
          ln -sf "$CARGO_HOME/bin/rustup" /usr/local/bin/rustup
          cargo --version
          npm install -g pnpm@10.32.1

          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          WORK="$RUNNER_TEMP/pkg/openrevo-$VER"
          rm -rf "$RUNNER_TEMP/pkg"
          mkdir -p "$WORK"
          # Build from an exported tree: dpkg-buildpackage insists on debian/ at the
          # top of the source directory, and the packaging lives in packaging/.
          git archive HEAD | tar -x -C "$WORK"
          cp -a packaging/debian "$WORK/debian"
          # The changelog carries the version, so it is generated rather than kept
          # in the tree and drifting from Cargo.toml.
          cat > "$WORK/debian/changelog" <<EOF
          openrevo ($VER-1) unstable; urgency=medium

            * Automated build of $(git rev-parse --short HEAD).

           -- openrevo packagers <packagers@openrevo.invalid>  $(date -R)
          EOF
          sed -i 's/^          //' "$WORK/debian/changelog"
          cd "$WORK"
          # -d: build-dependency versions are checked by the job above, and the
          # container's apt state does not satisfy dpkg's exact requirements.
          dpkg-buildpackage -b -us -uc -d
          ls -l "$RUNNER_TEMP"/pkg/*.deb

      - uses: ./.github/actions/diag-log
        if: failure()
        with:
          name: deb

      - uses: actions/upload-artifact@v4
        with:
          name: openrevo-deb
          path: ${{ runner.temp }}/pkg/*.deb
          if-no-files-found: error

  package-rpm:
    name: Build Fedora package
    runs-on: ubuntu-24.04
    container: fedora:41
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git tar curl rpm-build nodejs npm pkgconf-pkg-config \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel libappindicator-gtk3-devel \
            openssl-devel dbus-devel systemd-devel libsoup3-devel zlib-devel

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .rpm
        shell: bash
        run: |
          set -euxo pipefail
          : > /tmp/step.log
          exec > >(tee -a /tmp/step.log) 2>&1
          # The checkout is owned by the runner's uid, not by root inside this
          # container, and git refuses to work on it until told otherwise.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          . "$CARGO_HOME/env"
          ln -sf "$CARGO_HOME/bin/cargo" /usr/local/bin/cargo
          ln -sf "$CARGO_HOME/bin/rustc" /usr/local/bin/rustc
          cargo --version
          npm install -g pnpm@10.32.1

          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          TOP="$RUNNER_TEMP/rpmbuild"
          rm -rf "$TOP"
          mkdir -p "$TOP"/{SOURCES,SPECS,BUILD,BUILDROOT,RPMS,SRPMS}
          git archive --prefix="openrevo-$VER/" -o "$TOP/SOURCES/openrevo-$VER.tar.gz" HEAD
          # --nodeps: cargo and rust come from rustup above and are invisible to
          # rpm's dependency solver, which would otherwise refuse the build.
          rpmbuild -ba --nodeps \
            --define "_topdir $TOP" \
            --define "version $VER" \
            packaging/rpm/openrevo.spec
          ls -l "$TOP"/RPMS/*/*.rpm

      - uses: ./.github/actions/diag-log
        if: failure()
        with:
          name: rpm

      - uses: actions/upload-artifact@v4
        with:
          name: openrevo-rpm
          path: ${{ runner.temp }}/rpmbuild/RPMS/*/*.rpm
          if-no-files-found: error
