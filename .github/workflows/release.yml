name: Release & Cloud Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest
    outputs:
      tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installed by hand instead of pnpm/action-setup: the `packageManager`
      # field carries a full integrity hash and the action's fallback parsing of
      # it is the first thing to break here.
      - name: Setup pnpm
        run: |
          npm install -g pnpm@10.32.1
          pnpm --version

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Hardware Vault Gatekeeper
        shell: pwsh
        run: ./scripts/check_vault_leaks.ps1

      - name: Build Standalone Executable
        run: pnpm tauri build --no-bundle

      - name: Build NSIS Installer
        run: pnpm tauri build --bundles nsis

      # ------------------------------------------------------------------------
      # [Open Source Code Signing Hook - Reserved for SignPath / Trusted Signing]
      # When approved for free open source signing, insert the signing action here:
      # - name: Sign Executable & Installer
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     ...
      # ------------------------------------------------------------------------

      - name: Prepare Artifacts & Calculate Hashes
        id: prepare_artifacts
        shell: pwsh
        run: |
          $ver = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$ver-dev" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $tag -ne "v$ver") { throw "Tag and application version differ" }
          if ((Get-Content "package.json" -Raw | ConvertFrom-Json).version -ne $ver) { throw "Frontend and application version differ" }
          Write-Host "Target Version: $ver | Tag: $tag" -ForegroundColor Green

          $distDir = "dist_artifacts"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          # 1. Standalone Exe
          $srcExe = "src-tauri/target/release/open-revo.exe"
          $destExe = "$distDir/open-revo.exe"
          Copy-Item -LiteralPath $srcExe -Destination $destExe -Force

          # 2. Portable 7z Archive
          $portableName = "OpenRevo-${tag}-portable.7z"
          $dest7z = "$distDir/$portableName"
          & 7z a -t7z -mx=9 "$dest7z" "$destExe"
          if ($LASTEXITCODE -ne 0) { throw "Portable archive build failed" }

          # 3. NSIS Installer
          $nsisSourceDir = "src-tauri/target/release/bundle/nsis"
          $matchedNsis = Get-ChildItem -Path $nsisSourceDir -Filter "*.exe" | Where-Object { $_.Name.Contains($ver) } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($matchedNsis) {
              $installerName = "OpenRevo-${tag}-x64-Setup.exe"
              $destInstaller = "$distDir/$installerName"
              Copy-Item -LiteralPath $matchedNsis.FullName -Destination $destInstaller -Force
              Write-Host "Found NSIS Installer: $installerName" -ForegroundColor Cyan
          }

          if (-not $matchedNsis) { throw "Matching NSIS installer is missing" }
          $assets = @{}
          foreach ($asset in @(@("binary_only", $destExe), @("installer", $destInstaller))) {
              $item = Get-Item -LiteralPath $asset[1]
              $assets[$asset[0]] = @{
                  filename = $item.Name
                  size = $item.Length
                  sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash.ToLowerInvariant()
                  sources = @{ github = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($item.Name)"; gitee = "" }
              }
          }
          $manifest = @{
              version = $ver; tag = $tag; display_version = $tag
              commit = $env:GITHUB_SHA
              pub_date = [DateTime]::UtcNow.ToString("o")
              build_timestamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
              notes = "OpenRevo $tag"; assets = $assets
          }
          $manifestPath = "$distDir/latest.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
          $verified = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($verified.version -ne $ver -or $verified.assets.binary_only.sha256.Length -ne 64 -or $verified.assets.installer.sha256.Length -ne 64) {
              throw "Generated update manifest validation failed"
          }

          # 4. Generate SHA256 Checksums
          $checksumFile = "$distDir/checksums.txt"
          Get-ChildItem -Path $distDir -Filter "*.*" | Where-Object { $_.Name -ne "checksums.txt" } | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -FilePath $checksumFile -Append -Encoding ascii
          }

          Write-Host "=== Artifacts Prepared ===" -ForegroundColor Green
          Get-Content $checksumFile

          # Set output for subsequent steps
          echo "tag_name=$tag" >> $env:GITHUB_OUTPUT
          echo "app_version=$ver" >> $env:GITHUB_OUTPUT

      - name: Upload Build Artifacts (Workflow Storage)
        uses: actions/upload-artifact@v4
        with:
          name: open-revo-artifacts-${{ steps.prepare_artifacts.outputs.tag_name }}
          path: dist_artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build Arch Package (x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          # `sudo` is not part of base-devel, and makepkg -s needs it for
          # makedepends, so it has to be requested explicitly.
          pacman -Syu --noconfirm --needed git rust nodejs pnpm sudo \
            webkit2gtk-4.1 gtk3 librsvg libappindicator-gtk3 hicolor-icon-theme openssl

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # makepkg refuses to run as root and the Arch container is root by default.
      - name: Build package
        env:
          CI_REPO: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          useradd -m -s /bin/bash builder
          # makepkg -s installs makedepends through sudo; give the builder account
          # passwordless rights or it stalls on a prompt nobody answers.
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder .
          id builder
          ls -ld . packaging/linux
          # `sudo -u` rather than `su`/`runuser`: su trips over PAM's token update
          # for a passwordless account ("Authentication token manipulation error"),
          # and the bare Arch container ships no PAM config for runuser at all.
          cd packaging/linux
          sudo -H -u builder -- env _repo="$CI_REPO" _commit="$CI_SHA" \
            makepkg -s --noconfirm --nocheck 2>&1 | tee /tmp/makepkg.log || {
              rc=$?
              tail -n 120 /tmp/makepkg.log
              exit "$rc"
            }
          ls -1 ./*.pkg.tar.zst

      - name: Prepare artifacts & checksums
        run: |
          set -eu
          # The tag already carries the version; keep the pkgver out of the file
          # name so the two cannot disagree.
          tag="$GITHUB_REF_NAME"
          case "$GITHUB_REF_TYPE" in
            tag) ;;
            *) tag="$(sed -n 's/.*"version": *"\([^"]*\)".*/v\1-dev/p' src-tauri/tauri.conf.json | head -1)" ;;
          esac
          pkg=$(ls -1 packaging/linux/*.pkg.tar.zst | head -1)
          mkdir -p dist_artifacts
          out="dist_artifacts/OpenRevo-${tag}-x86_64.pkg.tar.zst"
          cp "$pkg" "$out"
          (cd dist_artifacts && sha256sum "$(basename "$out")" > checksums-linux.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: open-revo-linux-${{ github.ref_name }}
          path: dist_artifacts/*
          if-no-files-found: error

  # The Debian and Fedora jobs mirror build-linux above; each has to build inside
  # its own distribution container so the linked library set matches the package
  # manager that will install the result.
  build-deb:
    name: Build Debian Package (x86_64)
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential debhelper devscripts dpkg-dev \
            nodejs npm pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libdbus-1-dev libudev-dev \
            libsoup-3.0-dev zlib1g-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        run: |
          set -euxo pipefail
          exec > >(tee /tmp/step.log) 2>&1
          # Debian's rustc is far below what the dependency tree needs (slint and
          # wgpu both sit above 1.80), so the toolchain comes from rustup and is
          # linked into /usr/local/bin where debian/rules will find it.
          export RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          . "$CARGO_HOME/env"
          ln -sf "$CARGO_HOME/bin/cargo" /usr/local/bin/cargo
          ln -sf "$CARGO_HOME/bin/rustc" /usr/local/bin/rustc
          ln -sf "$CARGO_HOME/bin/rustup" /usr/local/bin/rustup
          npm install -g pnpm@10.32.1

          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          WORK="$RUNNER_TEMP/pkg/openrevo-$VER"
          rm -rf "$RUNNER_TEMP/pkg"
          mkdir -p "$WORK"
          # Build from an exported tree: dpkg-buildpackage insists on debian/ at the
          # top of the source directory, and the packaging lives in packaging/.
          git archive HEAD | tar -x -C "$WORK"
          cp -a packaging/debian "$WORK/debian"
          # The changelog carries the version, so it is generated rather than kept
          # in the tree and drifting from Cargo.toml.
          cat > "$WORK/debian/changelog" <<EOF
          openrevo ($VER-1) unstable; urgency=medium

            * Automated build of $(git rev-parse --short HEAD).

           -- openrevo packagers <packagers@openrevo.invalid>  $(date -R)
          EOF
          sed -i 's/^          //' "$WORK/debian/changelog"
          cd "$WORK"
          # -d: the container's apt state cannot satisfy dpkg's exact version
          # requirements, and the build dependencies are installed above anyway.
          dpkg-buildpackage -b -us -uc -d
          ls -l "$RUNNER_TEMP"/pkg/*.deb

      - name: Prepare artifacts & checksums
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          case "$GITHUB_REF_TYPE" in
            tag) ;;
            *) tag="$(sed -n 's/.*"version": *"\([^"]*\)".*/v\1-dev/p' src-tauri/tauri.conf.json | head -1)" ;;
          esac
          deb=$(ls -1 "$RUNNER_TEMP"/pkg/*.deb | head -1)
          arch=$(dpkg-deb -f "$deb" Architecture)
          mkdir -p dist_artifacts
          out="dist_artifacts/OpenRevo-${tag}-${arch}.deb"
          cp "$deb" "$out"
          (cd dist_artifacts && sha256sum "$(basename "$out")" > checksums-deb.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: open-revo-deb-${{ github.ref_name }}
          path: dist_artifacts/*
          if-no-files-found: error

  build-rpm:
    name: Build Fedora Package (x86_64)
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git tar curl rpm-build nodejs npm pkgconf-pkg-config \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel libappindicator-gtk3-devel \
            openssl-devel dbus-devel systemd-devel libsoup3-devel zlib-devel

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        run: |
          set -euxo pipefail
          exec > >(tee /tmp/step.log) 2>&1
          # Fedora's rust is close, but not reliably above the dependency tree's
          # floor, so it comes from rustup like the Debian job.
          export RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          . "$CARGO_HOME/env"
          ln -sf "$CARGO_HOME/bin/cargo" /usr/local/bin/cargo
          ln -sf "$CARGO_HOME/bin/rustc" /usr/local/bin/rustc
          npm install -g pnpm@10.32.1

          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          TOP="$RUNNER_TEMP/rpmbuild"
          rm -rf "$TOP"
          mkdir -p "$TOP"/{SOURCES,SPECS,BUILD,BUILDROOT,RPMS,SRPMS}
          git archive --prefix="openrevo-$VER/" -o "$TOP/SOURCES/openrevo-$VER.tar.gz" HEAD
          rpmbuild -ba \
            --define "_topdir $TOP" \
            --define "version $VER" \
            packaging/rpm/openrevo.spec
          ls -l "$TOP"/RPMS/*/*.rpm

      - name: Prepare artifacts & checksums
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          case "$GITHUB_REF_TYPE" in
            tag) ;;
            *) tag="$(sed -n 's/.*"version": *"\([^"]*\)".*/v\1-dev/p' src-tauri/tauri.conf.json | head -1)" ;;
          esac
          rpm=$(ls -1 "$RUNNER_TEMP"/rpmbuild/RPMS/*/*.rpm | head -1)
          arch=$(rpm -qp --qf '%{ARCH}' "$rpm")
          mkdir -p dist_artifacts
          out="dist_artifacts/OpenRevo-${tag}.${arch}.rpm"
          cp "$rpm" "$out"
          (cd dist_artifacts && sha256sum "$(basename "$out")" > checksums-rpm.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: open-revo-rpm-${{ github.ref_name }}
          path: dist_artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [build-windows, build-linux, build-deb, build-rpm]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.draft == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: open-revo-*
          merge-multiple: true
          path: dist_artifacts

      - name: List collected assets
        run: ls -l dist_artifacts

      - name: Publish GitHub Release (Tag / Dispatch)
        uses: softprops/action-gh-release@v2
        with:
          name: OpenRevo ${{ needs.build-windows.outputs.tag_name }}
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(needs.build-windows.outputs.tag_name, '-') }}
          files: dist_artifacts/*
          generate_release_notes: true
